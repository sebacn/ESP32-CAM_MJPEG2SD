
; Select an example
[platformio]
src_dir = ESP32-CAM_MJPEG2SD


[env:t-cameras3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32s3box

board_build.partitions = partitions.csv

upload_speed =  921600
monitor_speed = 115200

; monitor_port = COM94
; upload_port  = COM94

lib_ldf_mode = deep

build_flags =
    -DBOARD_HAS_PSRAM     
    ; -DCORE_DEBUG_LEVEL=5

    ; Enable UARDUINO_ USB_ CDC_ ON_ BOOT will start printing and wait for terminal access during startup
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; Enable UARDUINO_USB_CDC_ON_BOOT will turn off printing and will not block when using the battery
    ; -UARDUINO_USB_CDC_ON_BOOT

    ;Defined using platformio, for AllFunction Examples
    -DPLATFORMIO_ENV
    ; -DMBEDTLS_KEY_EXCHANGE_SOME_PSK_ENABLED
    ; -DCONFIG_MBEDTLS_SSL_ALPN

lib_dir = 
    -I ESP32-CAM_MJPEG2SD

lib_deps =
    dvarrel/ESPping
    XPowersLib
    ; NetworkClientSecure
    ; Networking